# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ================================
# JVM Settings
# ================================
# Specifies the JVM arguments used for the daemon process.
# Increased memory for faster builds
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ================================
# Build Performance
# ================================
# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable caching to speed up builds
org.gradle.caching=true

# Configuration cache for faster configuration phase
org.gradle.configuration-cache=true

# ================================
# Kotlin Settings
# ================================
kotlin.code.style=official

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Enable Kotlin compiler daemon for faster compilation
kotlin.compiler.execution.strategy=daemon

# ================================
# Android Settings
# ================================
# AndroidX required
android.useAndroidX=true

# R8 full mode for maximum optimization
android.enableR8.fullMode=true

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Suppress Kotlin source sets conflict with AGP built-in Kotlin
#android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
